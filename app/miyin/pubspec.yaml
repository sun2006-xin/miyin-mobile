name: miyin_app
description: "觅音独立手机应用"
publish_to: 'none'
# Increment the build suffix to publish a signed Android preview through GitHub Actions.
version: 1.6.0-preview+70

environment:
  sdk: ^3.13.2

dependencies:
  archive: ^4.4.0
  crypto: ^3.0.7
  file_picker: 13.1.0
  flutter:
    sdk: flutter
  image_picker: 1.2.4
  html: 0.15.7
  xml: 7.1.0
  path_provider: ^2.1.6
  record: 6.1.2
  sherpa_onnx: 2.0.1
  sqflite: ^2.4.4+1
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/legal/
    - assets/brand/miyin-logo-selected.png
    - assets/aurora-shape.glsl
    - assets/miyin-mode-wheel-glass.glsl
    - assets/miyin_v5/
    - assets/miyin_v5/fonts/
    - assets/voice/asr-zh-en/
    - assets/voice/asr-whisper-base/
    - assets/voice/tts-melo-zh-en/
    - assets/voice/tts-matcha-zh-en/
    - assets/voice/tts-supertonic3/
    - assets/dictionary/
    - assets/chat-model/
