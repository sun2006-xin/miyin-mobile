name: miyin_app
description: "觅音独立手机应用"
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: ^3.13.2

dependencies:
  file_picker: 13.1.0
  flutter:
    sdk: flutter
  image_picker: 1.2.4
  sqflite: ^2.4.4+1
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/brand/miyin-logo-selected.png
    - assets/aurora-shape.glsl
    - assets/miyin-mode-wheel-glass.glsl
    - assets/miyin_v5/
