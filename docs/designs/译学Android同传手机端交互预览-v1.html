<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>译学 Android 手机端 · 交互预览 V1</title>
  <style>
    :root {
      color-scheme: light;
      --board: #e9eee9;
      --board-line: #dbe2dc;
      --paper: #f5f5ef;
      --surface: #fffefa;
      --surface-2: #f8f8f2;
      --ink: #1e2b28;
      --muted: #6c7b76;
      --soft: #94a19b;
      --line: #e4e8e1;
      --teal: #16766b;
      --teal-deep: #105f57;
      --teal-soft: #e5f2ed;
      --blue: #3296d8;
      --green: #43b878;
      --amber: #bd7040;
      --amber-soft: #fbf0e5;
      --red: #b94d4b;
      --shadow: 0 22px 60px rgba(28, 53, 45, .16);
      --phone-shadow: 0 16px 36px rgba(22, 42, 36, .25);
      --radius-card: 18px;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--board); }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(900px 560px at 80% -10%, rgba(84, 165, 131, .12), transparent 70%),
        linear-gradient(135deg, #eef1eb 0%, #e6ece6 100%);
      font-family: "Microsoft YaHei UI", "Noto Sans SC", "Segoe UI", sans-serif;
    }

    button, input, textarea { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 3px solid rgba(22, 118, 107, .45);
      outline-offset: 2px;
    }
    .board { width: min(1420px, calc(100% - 48px)); margin: 0 auto; padding: 30px 0 44px; }
    .board-header {
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
      padding: 0 4px 24px;
    }
    .brand { display: flex; align-items: center; gap: 13px; }
    .brand img { width: 42px; height: 42px; object-fit: contain; }
    .brand-title { font-size: 16px; font-weight: 750; letter-spacing: .04em; }
    .brand-sub { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .board-heading { margin-left: auto; margin-right: auto; }
    .board-heading h1 { margin: 0; font-size: 23px; letter-spacing: -.035em; font-weight: 730; }
    .board-heading p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    .toolbar { display: flex; align-items: center; gap: 9px; }
    .tool-button {
      border: 1px solid var(--board-line); border-radius: 11px; padding: 10px 13px;
      background: rgba(255,255,255,.65); cursor: pointer; font-size: 12px; font-weight: 650;
    }
    .tool-button:hover { background: #fff; }
    .tool-button.primary { color: white; border-color: var(--teal); background: var(--teal); }

    .workspace {
      display: grid; grid-template-columns: 220px minmax(360px, 440px) minmax(260px, 1fr);
      align-items: start; gap: 24px;
    }
    .nav-panel, .notes-panel {
      border: 1px solid rgba(211, 222, 214, .9); border-radius: 20px;
      background: rgba(255,255,251,.72); box-shadow: 0 8px 26px rgba(30,54,46,.055);
    }
    .nav-panel { padding: 17px 13px; }
    .panel-eyebrow {
      color: var(--soft); font-size: 10px; font-weight: 750; letter-spacing: .15em;
      text-transform: uppercase; padding: 0 9px 11px;
    }
    .screen-nav { display: grid; gap: 5px; }
    .screen-nav button {
      width: 100%; min-height: 45px; text-align: left; border: 0; border-radius: 11px;
      padding: 0 11px; background: transparent; cursor: pointer; display: flex;
      align-items: center; gap: 10px; color: #52615d; font-size: 13px;
    }
    .screen-nav button:hover { background: #f1f5ef; }
    .screen-nav button[aria-current="page"] {
      color: var(--teal-deep); background: var(--teal-soft); font-weight: 720;
    }
    .nav-index {
      display: grid; place-items: center; width: 22px; height: 22px; flex: none;
      border: 1px solid currentColor; border-radius: 7px; font-size: 10px;
    }
    .nav-bottom {
      margin: 18px 8px 2px; padding-top: 13px; border-top: 1px solid var(--line);
      color: var(--muted); font-size: 11px; line-height: 1.65;
    }
    .device-stage { display: grid; place-items: center; }
    .device-caption {
      display: flex; align-items: center; justify-content: space-between; width: min(100%, 390px);
      margin-bottom: 11px; color: #677670; font-size: 11px;
    }
    .device-caption strong { color: #31413b; font-size: 12px; }
    .device {
      width: min(100%, 390px); height: 806px; padding: 8px; border-radius: 38px;
      background: #192720; box-shadow: var(--phone-shadow); position: relative;
    }
    .device:before {
      content: ""; position: absolute; z-index: 10; top: 10px; left: 50%; transform: translateX(-50%);
      width: 95px; height: 23px; background: #15211c; border-radius: 0 0 15px 15px;
    }
    .phone-screen {
      height: 100%; overflow: hidden; position: relative; border-radius: 31px;
      background: var(--paper); display: flex; flex-direction: column;
    }
    .statusbar {
      height: 35px; padding: 11px 20px 0; display: flex; justify-content: space-between;
      align-items: center; color: #53615c; font-size: 10px; font-weight: 700; flex: none;
    }
    .status-dots { letter-spacing: 2px; font-size: 9px; }
    .appbar {
      height: 54px; flex: none; padding: 0 18px; display: flex; align-items: center;
      justify-content: space-between; border-bottom: 1px solid rgba(222,227,219,.7);
    }
    .appbar-left { display: flex; align-items: center; gap: 10px; }
    .appbar img { width: 28px; height: 28px; object-fit: contain; }
    .appbar-title { font-size: 15px; font-weight: 740; letter-spacing: -.02em; }
    .appbar-sub { display: block; font-size: 11px; color: var(--muted); font-weight: 500; margin-top: 2px; }
    .icon-button {
      width: 44px; height: 44px; border: 1px solid transparent; border-radius: 12px;
      background: transparent; cursor: pointer; display: grid; place-items: center; color: #5c6a64;
      font-size: 18px;
    }
    .icon-button:hover { background: #edf3ed; border-color: #e0e8df; }
    .screen-content { flex: 1; overflow: auto; padding: 19px 18px 18px; scrollbar-width: thin; }
    .bottom-nav {
      flex: none; min-height: 67px; display: grid; grid-template-columns: repeat(4,1fr);
      align-items: center; border-top: 1px solid var(--line); padding: 4px 8px 7px;
      background: rgba(255,254,250,.96);
    }
    .bottom-nav button {
      border: 0; background: transparent; cursor: pointer; display: grid; justify-items: center;
      align-content: center; gap: 4px; min-height: 51px; border-radius: 12px;
      color: #87918b; font-size: 10px;
    }
    .bottom-nav button[aria-current="page"] { color: var(--teal-deep); font-weight: 720; }
    .nav-glyph {
      display: grid; place-items: center; width: 24px; height: 22px; font-size: 15px;
      line-height: 1; border-radius: 7px;
    }
    .bottom-nav button[aria-current="page"] .nav-glyph { background: var(--teal-soft); }
    .notes-panel { min-height: 340px; padding: 21px 22px; }
    .notes-title { font-size: 16px; font-weight: 760; margin: 0; }
    .notes-copy { color: var(--muted); line-height: 1.65; font-size: 12px; margin: 7px 0 17px; }
    .interaction-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
    .interaction-list li {
      display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start;
      padding: 11px 0; border-top: 1px solid var(--line);
    }
    .interaction-list .step {
      width: 24px; height: 24px; display: grid; place-items: center; border-radius: 8px;
      color: var(--teal-deep); background: var(--teal-soft); font-size: 10px; font-weight: 750;
    }
    .interaction-list strong { display: block; font-size: 12px; }
    .interaction-list small { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; line-height: 1.55; }
    .boundary-note {
      margin-top: 17px; border-radius: 12px; background: #f2f4ec; padding: 12px 13px;
      font-size: 11px; color: #58655d; line-height: 1.6;
    }
    .boundary-note b { color: #34453c; }

    .eyebrow { color: var(--teal); font-size: 10px; font-weight: 800; letter-spacing: .12em; }
    h2 { margin: 7px 0 0; font-size: 24px; letter-spacing: -.045em; line-height: 1.18; }
    .lede { margin: 8px 0 0; font-size: 13px; color: var(--muted); line-height: 1.6; }
    .section-label { margin: 22px 0 10px; font-size: 12px; color: #596761; font-weight: 750; }
    .privacy-pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 9px; border-radius: 20px;
      background: #edf4ec; color: #41735a; font-size: 11px; font-weight: 700;
    }
    .privacy-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
    .hero {
      position: relative; overflow: hidden; margin-top: 18px; padding: 18px 18px 17px;
      border: 1px solid #d3e9df; border-radius: 21px;
      background:
        radial-gradient(140px 110px at 100% 0%, rgba(74,185,139,.18), transparent 75%),
        linear-gradient(140deg, #f7fbf5 0%, #eaf5ee 100%);
    }
    .hero:after {
      content: ""; position: absolute; width: 112px; height: 112px; right: -34px; top: 56px;
      border: 1px solid rgba(22,118,107,.14); border-radius: 50%;
      box-shadow: 0 0 0 13px rgba(22,118,107,.035), 0 0 0 27px rgba(22,118,107,.025);
      pointer-events: none;
    }
    .hero-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .hero-kicker { color: #52776a; font-size: 11px; font-weight: 750; }
    .hero-title { max-width: 260px; margin: 11px 0 0; font-size: 22px; line-height: 1.3; font-weight: 770; letter-spacing: -.04em; }
    .language-pair { display: flex; align-items: center; gap: 7px; margin-top: 12px; font-size: 12px; font-weight: 720; }
    .language-chip { border: 1px solid #d6e4da; border-radius: 8px; padding: 6px 9px; background: rgba(255,255,255,.75); }
    .swap { color: var(--teal); font-weight: 800; }
    .primary-button {
      position: relative; z-index: 1; display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; min-height: 47px; border: 0; border-radius: 12px; padding: 0 15px; margin-top: 17px;
      background: var(--teal); color: #fff; font-weight: 740; font-size: 12px; cursor: pointer;
      box-shadow: 0 5px 12px rgba(22,118,107,.15);
    }
    .primary-button:hover { background: var(--teal-deep); }
    .arrow { font-size: 17px; line-height: 1; }
    .quick-list { margin-top: 12px; overflow: hidden; border-top: 1px solid var(--line); }
    .quick-row {
      width: 100%; display: flex; gap: 12px; align-items: center; min-height: 61px; text-align: left;
      padding: 8px 3px; border: 0; border-bottom: 1px solid var(--line); background: transparent; cursor: pointer;
    }
    .quick-row:hover { background: rgba(228,242,237,.38); }
    .quick-icon {
      width: 34px; height: 34px; flex: none; display: grid; place-items: center; border-radius: 11px;
      background: #edf2eb; color: #57736a; font-size: 14px; font-weight: 750;
    }
    .quick-copy { flex: 1; }
    .quick-copy b { display: block; font-size: 13px; }
    .quick-copy small { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
    .quick-arrow { color: #8c9a92; font-size: 17px; }
    .recent {
      margin-top: 20px; display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 10px; border-bottom: 1px solid var(--line);
    }
    .recent-title { font-size: 12px; font-weight: 760; }
    .text-link { border: 0; background: transparent; color: var(--teal); font-size: 11px; font-weight: 700; cursor: pointer; }
    .recent-item { display: flex; align-items: center; gap: 11px; padding: 12px 0 1px; }
    .recent-line { width: 2px; height: 28px; margin-left: 15px; background: #9fcab5; border-radius: 3px; }
    .recent-item strong { font-size: 11px; }
    .recent-item small { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }

    .subpage-head { display: flex; align-items: center; gap: 7px; margin: -8px 0 17px; }
    .back-button { width: 42px; height: 42px; border: 1px solid var(--line); border-radius: 11px; background: #fff; cursor: pointer; }
    .subpage-title { font-size: 14px; font-weight: 750; }
    .subpage-meta { margin-left: auto; color: var(--muted); font-size: 10px; }
    .lang-bar {
      display: grid; grid-template-columns: 1fr 38px 1fr; align-items: center;
      padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface);
    }
    .lang-side { min-width: 0; }
    .lang-side span { display: block; color: var(--muted); font-size: 10px; }
    .lang-side strong { display: block; margin-top: 4px; font-size: 13px; }
    .lang-swap {
      width: 40px; height: 40px; border: 1px solid #d9e8df; border-radius: 11px;
      color: var(--teal); background: #f3f8f3; cursor: pointer;
    }
    .turn-label { margin: 19px 0 9px; color: var(--muted); font-size: 11px; font-weight: 650; }
    .dialogue { display: grid; gap: 11px; }
    .dialogue-block { padding: 12px 13px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); }
    .dialogue-block.mine { border-color: #d7e8df; background: #f2f8f2; }
    .speaker { color: var(--muted); font-size: 10px; font-weight: 750; letter-spacing: .04em; }
    .source-text { margin-top: 7px; font-size: 14px; line-height: 1.55; font-weight: 630; }
    .translated-text { margin-top: 7px; color: #4d625a; font-size: 13px; line-height: 1.6; }
    .block-actions { display: flex; align-items: center; gap: 7px; margin-top: 9px; }
    .mini-button {
      min-height: 39px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px;
      background: rgba(255,255,255,.8); cursor: pointer; color: #53635c; font-size: 10px;
    }
    .live-status { display: flex; align-items: center; gap: 7px; margin-top: 12px; color: #738078; font-size: 11px; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #d59a52; }
    .live-dot.active { background: #c35c53; box-shadow: 0 0 0 4px rgba(195,92,83,.1); }
    .talk-zone { position: sticky; bottom: 0; margin: 15px -18px -18px; padding: 12px 18px 15px; background: linear-gradient(180deg, rgba(245,245,239,0) 0%, var(--paper) 22%); }
    .direction-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 9px; }
    .direction-chip { min-height: 39px; border: 1px solid #d9e8df; border-radius: 20px; padding: 0 11px; background: #f6faf6; color: #45665a; font-size: 11px; font-weight: 700; cursor: pointer; }
    .auto-toggle { min-height: 39px; border: 0; background: transparent; color: #68756e; font-size: 11px; cursor: pointer; }
    .talk-button {
      width: 100%; min-height: 66px; border: 0; border-radius: 16px; background: var(--teal);
      color: white; cursor: pointer; font-weight: 750; font-size: 14px; touch-action: none;
      transition: transform .12s, background .15s, box-shadow .15s;
      box-shadow: 0 7px 15px rgba(22,118,107,.16);
    }
    .talk-button.pressed { transform: scale(.985); background: #b86a3f; box-shadow: 0 0 0 5px rgba(184,106,63,.14); }
    .talk-button small { display: block; margin-top: 5px; color: rgba(255,255,255,.78); font-size: 10px; font-weight: 500; }

    .source-switch { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; gap: 4px; border-radius: 12px; background: #eaeee8; }
    .source-switch button { min-height: 42px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-size: 11px; font-weight: 700; cursor: pointer; }
    .source-switch button[aria-pressed="true"] { background: var(--surface); color: var(--teal-deep); box-shadow: 0 1px 4px rgba(25,45,35,.08); }
    .source-card {
      margin-top: 13px; padding: 14px; border: 1px solid var(--line); border-radius: 15px; background: var(--surface);
    }
    .source-card-head { display: flex; align-items: center; gap: 10px; }
    .source-symbol { display: grid; place-items: center; width: 35px; height: 35px; border-radius: 11px; background: #eaf3ee; color: var(--teal); font-weight: 800; }
    .source-card-head b { font-size: 12px; }
    .source-card-head small { display: block; margin-top: 3px; font-size: 10px; color: var(--muted); }
    .source-desc { margin: 11px 0 0; color: #65746c; font-size: 11px; line-height: 1.65; }
    .system-note { margin-top: 13px; padding: 11px 12px; border-radius: 11px; background: var(--amber-soft); color: #7e583c; font-size: 11px; line-height: 1.6; }
    .capture-status {
      display: flex; align-items: center; justify-content: space-between; margin-top: 14px;
      padding: 10px 0; border-bottom: 1px solid var(--line); color: #596861; font-size: 10px;
    }
    .status-label { display: inline-flex; align-items: center; gap: 6px; }
    .status-label .live-dot { background: #99a69e; }
    .status-label.ready .live-dot { background: var(--green); }
    .subtitles-preview { margin-top: 14px; padding: 15px 13px; border-radius: 14px; background: #23342e; color: white; }
    .subtitles-preview small { color: #a8c0b2; font-size: 10px; }
    .subtitle-line { margin-top: 9px; font-size: 14px; line-height: 1.55; font-weight: 650; }
    .subtitle-translation { margin-top: 4px; color: #d1e1d8; font-size: 12px; line-height: 1.6; }
    .pip-row { display: flex; align-items: center; justify-content: space-between; margin-top: 11px; }
    .pip-row span { font-size: 11px; color: #596861; }
    .switch { width: 39px; height: 23px; padding: 3px; border: 0; border-radius: 20px; background: #c6cec7; cursor: pointer; }
    .switch:after { content: ""; display: block; width: 17px; height: 17px; border-radius: 50%; background: white; transition: transform .16s; }
    .switch[aria-pressed="true"] { background: var(--teal); }
    .switch[aria-pressed="true"]:after { transform: translateX(16px); }

    .screen-content.chat-page { display: flex; flex-direction: column; }
    .chat-scroll { display: grid; flex: 1; align-content: start; gap: 15px; padding-bottom: 12px; overflow: auto; }
    .chat-context { display: flex; justify-content: center; margin-bottom: 1px; }
    .context-chip { border: 1px solid #dce8df; border-radius: 20px; padding: 7px 10px; color: #5e7168; background: #f6faf5; font-size: 10px; }
    .message { max-width: 88%; }
    .message.user { justify-self: end; }
    .message.assistant { justify-self: start; }
    .message-role { margin: 0 0 5px 2px; color: #89958e; font-size: 10px; font-weight: 700; }
    .message-body { padding: 11px 12px; border-radius: 14px; background: #fff; border: 1px solid var(--line); font-size: 12px; line-height: 1.7; }
    .message.user .message-body { background: #e6f3ed; border-color: #d4e8de; }
    .agent-activity { margin-top: 9px; padding: 9px 10px; border-left: 2px solid #79aa91; background: #f4f7f1; color: #66756d; font-size: 10px; }
    .agent-activity b { color: #446557; }
    .chat-composer {
      margin: auto -7px 0; padding: 11px 11px 8px; border: 1px solid #dfe5dd;
      border-radius: 17px; background: #fffefa; box-shadow: 0 6px 20px rgba(25,47,38,.07);
    }
    .composer-context { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
    .model-pill { border: 0; border-radius: 9px; padding: 6px 8px; background: #eff5ef; color: #3f6a5d; font-size: 9px; font-weight: 730; cursor: pointer; }
    .composer-text {
      width: 100%; min-height: 48px; resize: vertical; border: 0; outline: 0; background: transparent;
      color: var(--ink); font-size: 12px; line-height: 1.5;
    }
    .composer-text::placeholder { color: #9aa39d; }
    .composer-actions { display: flex; align-items: center; gap: 5px; }
    .composer-spacer { flex: 1; }
    .composer-action {
      min-width: 34px; height: 34px; border: 0; border-radius: 10px; background: transparent;
      color: #64746d; cursor: pointer; font-size: 13px;
    }
    .composer-action:hover { background: #edf4ee; }
    .composer-action.send { color: white; background: var(--teal); font-size: 16px; }
    .send-hint { margin-top: 8px; text-align: center; color: #98a29c; font-size: 9px; }

    .record-list { margin-top: 15px; border-top: 1px solid var(--line); }
    .record-row {
      width: 100%; display: grid; grid-template-columns: 37px 1fr auto; gap: 10px;
      align-items: center; text-align: left; padding: 13px 1px; border: 0;
      border-bottom: 1px solid var(--line); background: transparent; cursor: pointer;
    }
    .record-row:hover { background: rgba(229,242,237,.4); }
    .record-icon { width: 35px; height: 35px; display: grid; place-items: center; border-radius: 11px; background: #edf2eb; color: #547569; font-size: 12px; font-weight: 760; }
    .record-row b { display: block; font-size: 11px; }
    .record-row small { display: block; margin-top: 4px; color: var(--muted); font-size: 9px; }
    .record-duration { font-size: 9px; color: #87938b; }
    .empty-state { margin-top: 12px; padding: 16px 13px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); font-size: 11px; line-height: 1.6; }
    .history-search {
      width: 100%; min-height: 41px; margin-top: 15px; padding: 0 12px;
      border: 1px solid var(--line); border-radius: 11px; background: var(--surface);
      color: var(--ink); font-size: 11px;
    }
    .history-search::placeholder { color: #99a49e; }
    .history-filters { display: flex; gap: 6px; overflow: auto; margin-top: 9px; padding-bottom: 2px; }
    .history-filters button {
      min-height: 30px; padding: 0 9px; white-space: nowrap; border: 1px solid var(--line);
      border-radius: 9px; background: transparent; color: var(--muted); font-size: 9px; cursor: pointer;
    }
    .history-filters button[aria-pressed="true"] { border-color: #cfe3d7; background: var(--teal-soft); color: var(--teal-deep); font-weight: 700; }

    .dark-mode {

    function chatView() {
      const attachedTitle = recordTitle(selectedRecordId);
      const attachedExample = ({
        airport: ["请问最近的地铁站怎么走？", "How can I get to the nearest subway station?"],
        course: ["The course starts at half past nine.", "课程九点半开始。"],

        ? '帮我从「' + attachedTitle + '」里整理重点，并挑出可以复用的表达。'

    function historyView() {

        ["course", "课", "设计课程第三讲", "听视频 · 其他 App 音频 · 英文 → 中文 · 10月5日", "28:06"],

        '<input class="history-search" id="historySearch" type="search" placeholder="搜索会话名称或译文" aria-label="搜索会话名称或译文">' +
        '<div class="history-filters" role="group" aria-label="会话类型筛选"><button type="button" data-filter="全部" aria-pressed="true">全部</button><button type="button" data-filter="面对面">面对面</button><button type="button" data-filter="视频">视频</button><button type="button" data-filter="会议">会议</button></div>' +
        '<div class="record-list">' + (recordRows || '<div class="empty-state">还没有会话记录。开始同传后，记录会保存在本机。</div>') + '</div>' +
        '<div class="boundary-note" style="margin-top:16px"><b>记录操作：</b>点一条查看双语时间线；长按或点菜单可收藏、附加给 Agent、导出或删除。</div>';

    function detailView() {
      const examples = {

        course: { type: "听视频 · English → 中文", time: "10月5日 · 28 分 06 秒", turns: [["讲师 · 09:31", "The course starts at half past nine.", "课程九点半开始。"], ["讲师 · 09:32", "Please submit your assignment by Friday.", "请在周五前提交作业。"]] },
        meeting: { type: "会议 · 中文 ⇄ English", time: "10月3日 · 42 分 31 秒", turns: [["你 · 10:15", "我们先确认一下这周的里程碑。", "Let's first confirm this week's milestones."], ["对方 · 10:16", "I will share the revised schedule this afternoon.", "我今天下午会分享修订后的时间表。"]] }
      };

      const continueLabel = ({ airport: "继续面对面同传", course: "重新开始听视频", meeting: "重新开始会议收音" })[selectedRecordId] || "继续同传";
      return '<div class="eyebrow">' + record.type + '</div><h2 style="font-size:22px">' + recordTitle(selectedRecordId) + '</h2><p class="lede">' + record.time + ' · 保存在本机</p>' +
        '<div class="turn-label">双语时间线 · 点译文可朗读</div><div class="dialogue">' + turns + '</div>' +
        '<div class="talk-zone" style="position:static;margin:16px -18px -18px"><button class="primary-button" style="width:100%;margin:0" type="button" data-action="ask-agent">问 Agent 这段会话　→</button><button class="mini-button" type="button" style="width:100%;margin-top:8px;min-height:42px" data-action="continue-session">' + continueLabel + '</button></div>';
    }

    function recordTitle(id) {
      return ({ airport: "机场问路", course: "设计课程第三讲", meeting: "产品讨论" })[id] || "同传会话";
    }

    function recordSubtitle(id) {
      return ({ airport: "面对面 · 昨天 16:42 · 07:12", course: "听视频 · 10月5日 · 28:06", meeting: "会议 · 10月3日 · 42:31" })[id] || "同传会话";
    }

    function modelsView() {
      return '<div class="eyebrow">模型不绑在聊天界面里</div><h2 style="font-size:21px">配置好，再来选择</h2><p class="lede">API 厂商、密钥与模型发现集中管理；Agent 聊天里只切换已经验证的模型。</p>' +
        '<section class="model-hero"><div class="model-hero-top"><b>Agent 默认模型</b><span class="state-tag">尚未选择</span></div><p>配置并测试对话模型后，可以设为默认。此设置与翻译模型相互独立。</p><button class="text-link" style="margin-top:10px;padding:0" type="button" data-action="model">打开模型选择器 →</button></section>' +
        '<div class="section-label">远程 API 厂商</div><div class="provider-list">' +
        '<div class="provider-row"><div><b>DeepSeek</b><small>未配置 API</small></div><button type="button" data-provider="DeepSeek">配置</button></div>' +
        '<div class="provider-row"><div><b>阿里云百炼 / Qwen</b><small>未配置 API</small></div><button type="button" data-provider="阿里云百炼 / Qwen">配置</button></div>' +
        '<div class="provider-row"><div><b>SiliconFlow</b><small>未配置 API</small></div><button type="button" data-provider="SiliconFlow">配置</button></div>' +
        '<div class="provider-row"><div><b>自定义兼容接口</b><small>填写 API 地址和模型 ID</small></div><button type="button" data-provider="自定义兼容接口">添加</button></div></div>' +
        '<div class="model-footnote">保存后先测试连通性和模型能力；密钥进入设备安全存储，不写入会话记录。</div>';
    }

    function bottomMarkup() {
      const items = [["home","同传","译"],["chat","AI 助手","AI"],["history","会话","记"],["models","我的","我"]];
      return items.map(function (item) {
        const active = item[0] === current || (current === "face" || current === "media") && item[0] === "home" || current === "detail" && item[0] === "history";
        return '<button type="button" data-screen="' + item[0] + '" aria-current="' + (active ? "page" : "false") + '"><span class="nav-glyph">' + item[2] + '</span><span>' + item[1] + '</span></button>';
      }).join("");
    }

    function render() {
      const spec = screens[current];
      document.getElementById("screenName").textContent = spec.title;
      document.getElementById("appbar").innerHTML = current === "detail"
        ? appbarMarkup.detail({ title: recordTitle(selectedRecordId), subtitle: recordSubtitle(selectedRecordId) })
        : appbarMarkup[spec.appbar];
      const content = document.getElementById("screenContent");
      content.classList.toggle("chat-page", current === "chat");
      content.innerHTML = ({
        home: homeView, face: faceView, media: mediaView, chat: chatView, history: historyView, detail: detailView, models: modelsView
      })[spec.body]();
      document.getElementById("bottomNav").innerHTML = bottomMarkup();
      document.getElementById("notesTitle").textContent = spec.notesTitle;
      document.getElementById("notesCopy").textContent = spec.notesCopy;
      document.getElementById("interactionList").innerHTML = spec.steps.map(function (step, index) {
        return '<li><span class="step">' + (index + 1) + '</span><span><strong>' + step[0] + '</strong><small>' + step[1] + '</small></span></li>';
      }).join("");
      document.getElementById("boundaryNote").innerHTML = spec.boundary;
      document.querySelectorAll(".screen-nav [data-screen]").forEach(function (button) {
        if (button.dataset.screen === current) button.setAttribute("aria-current", "page");
        else button.removeAttribute("aria-current");
      });
    }

    function showScreen(name) {
      if (!screens[name]) return;
      if (name === "detail" && deletedRecords[selectedRecordId]) {
        name = "history";
        toast("这条预览会话已删除。" );
      }
      if (pressedPtt) finishPtt(true);
      current = name;
      document.getElementById("overlay").className = "hidden";
      render();
      document.getElementById("screenContent").scrollTop = 0;
    }

    function toast(message) {
      const node = document.getElementById("toast");
      node.textContent = message;
      node.classList.remove("hidden");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { node.classList.add("hidden"); }, 2600);
    }

    function sheet(title, body, foot) {
      const overlay = document.getElementById("overlay");
      overlay.className = "sheet-backdrop";
      overlay.innerHTML = '<section class="sheet" role="dialog" aria-modal="true" aria-label="' + title + '"><div class="sheet-handle"></div><div class="sheet-head"><b>' + title + '</b><button class="sheet-close" type="button" data-action="close-sheet" aria-label="关闭">×</button></div><div class="sheet-list">' + body + '</div><div class="sheet-foot">' + foot + '</div></section>';
    }

    function startPtt(button, event) {
      if (handsFree || current !== "face" || pressedPtt) return;
      pressedPtt = button;
      button.classList.add("pressed");
      const status = document.getElementById("faceStatus");
      const dot = document.getElementById("faceDot");
      if (status) status.textContent = "正在收音 · 松开发送（演示）";
      if (dot) dot.classList.add("active");
      if (event && event.pointerId !== undefined && button.setPointerCapture) {
        try { button.setPointerCapture(event.pointerId); } catch (error) { /* Pointer ended before capture. */ }
      }
    }

    function finishPtt(cancelled) {
      if (!pressedPtt) return;
      pressedPtt.classList.remove("pressed");
      pressedPtt = null;
      const status = document.getElementById("faceStatus");
      const dot = document.getElementById("faceDot");
      if (dot) dot.classList.remove("active");
      if (status) status.textContent = cancelled ? "本轮已取消 · 可以再次按住说话" : "已提交本轮 · 等待识别服务接入";
      if (!cancelled) toast("松开发送 → 识别 → 翻译 → 按播报设置朗读");
    }

    document.addEventListener("click", function (event) {
      if (event.target.id === "overlay") {
        document.getElementById("overlay").className = "hidden";
        return;
      }
      const screenButton = event.target.closest("[data-screen]");
      if (screenButton) {
        if (screenButton.dataset.record) selectedRecordId = screenButton.dataset.record;
        if (screenButton.dataset.meeting === "true") mediaSource = "mic";
        showScreen(screenButton.dataset.screen);
        return;
      }
      const sourceButton = event.target.closest("[data-source]");
      if (sourceButton) {
        if (mediaSource !== sourceButton.dataset.source && captureGranted) toast("切换音源会先结束当前收音。");
        mediaSource = sourceButton.dataset.source;
        captureGranted = false;
        pipOn = false;
        render();
        return;
      }
      const filterButton = event.target.closest("[data-filter]");
      if (filterButton) {
        document.querySelectorAll("[data-filter]").forEach(function (button) {
          button.setAttribute("aria-pressed", button === filterButton ? "true" : "false");
        });
        document.querySelectorAll(".record-row").forEach(function (row) {
          row.classList.toggle("hidden", filterButton.dataset.filter !== "全部" && !row.textContent.includes(filterButton.dataset.filter));
        });
        return;
      }
      const provider = event.target.closest("[data-provider]");
      if (provider) {
        const name = provider.dataset.provider;
        sheet("配置 " + name,
          '<label class="sheet-choice" style="display:grid;gap:6px;cursor:text"><b>API 地址</b><input aria-label="API 地址" placeholder="https://api.example.com/v1" style="border:0;background:transparent;color:var(--ink);outline:0"></label>' +
          '<label class="sheet-choice" style="display:grid;gap:6px;cursor:text"><b>API 密钥</b><input type="password" aria-label="API 密钥" placeholder="仅预览，不会保存" style="border:0;background:transparent;color:var(--ink);outline:0"></label>' +
          '<button class="sheet-choice" type="button" data-action="discover"><span><b>发现或手动添加模型</b><small>能力需单独验证</small></span><span>→</span></button>' +
          '<button class="primary-button" style="width:100%;margin-top:3px" type="button" data-action="test-api">测试连接（预览）</button>',
          "这只是页面草图；测试按钮不会联网，输入也不会写入。");
        return;
      }
      const action = event.target.closest("[data-action]");
      if (!action) return;
      switch (action.dataset.action) {
        case "close-sheet": document.getElementById("overlay").className = "hidden"; break;
        case "model":
          sheet("选择 Agent 模型",
            '<button class="sheet-choice" type="button" data-action="not-configured"><span><b>本地对话模型</b><small>尚未配置 Agent 对话能力</small></span><span>○</span></button>' +
            '<button class="sheet-choice" type="button" data-action="not-configured"><span><b>DeepSeek</b><small>需先配置 API</small></span><span>○</span></button>' +
            '<button class="sheet-choice" type="button" data-action="not-configured"><span><b>百炼 / Qwen</b><small>需先配置 API</small></span><span>○</span></button>' +
            '<button class="sheet-choice" type="button" data-action="not-configured"><span><b>SiliconFlow</b><small>需先配置 API</small></span><span>○</span></button>' +
            '<button class="sheet-choice" type="button" data-action="manage-models"><span><b>管理模型与服务</b><small>配置厂商、API 地址和模型</small></span><span>→</span></button>',
            "只显示已配置并验证过的模型；未配置项置灰。");
          break;
        case "manage-models": showScreen("models"); break;
        case "not-configured": toast("请先在“模型与服务”里配置并测试该模型。"); break;
        case "direction":
          direction = direction === "我说中文" ? "我说English" : "我说中文";
          render();
          break;
        case "mode-ptt":
          handsFree = false;
          continuousActive = false;
          render();
          toast("已切换为按住说话。" );
          break;
        case "mode-handsfree":
          handsFree = true;
          continuousActive = false;
          render();
          toast("免按住模式已选中，点下方按钮开始连续收音。" );
          break;
        case "continuous":
          if (!handsFree) break;
          continuousActive = !continuousActive;
          render();
          toast(continuousActive ? "连续收音已开始（预览）" : "连续收音已结束（预览）");
          break;
        case "autospeak":
          autoSpeak = !autoSpeak;
          render();
          toast(autoSpeak ? "自动播报已开启（预览）" : "自动播报已关闭，可点按朗读");
          break;
        case "speak": toast("点按朗读：后续接入 TTS；当前为界面预览。"); break;
        case "capture":
          if (!captureGranted) {
            if (mediaSource === "system") {
              sheet("Android 系统授权",
                '<p style="font-size:11px;line-height:1.6;color:var(--muted);margin:0">真实版本会跳转系统授权面板，由你选择允许捕获其他 App 音频。某些 App 可能不允许采集。</p><button class="primary-button" style="width:100%;margin-top:4px" type="button" data-action="grant-demo">模拟同意并继续</button>',
                "预览不会弹出真实系统对话框。");
            } else {
              captureGranted = true; render(); toast("麦克风收音状态已切换（演示）");
            }
          } else { captureGranted = false; pipOn = false; render(); toast("收音已结束（演示）"); }
          break;
        case "grant-demo": captureGranted = true; document.getElementById("overlay").className = "hidden"; render(); toast("系统音频已授权（仅演示状态）"); break;
        case "pip":
          if (!captureGranted) { toast("先开始收听，再开启 PiP 字幕。"); break; }
          pipOn = !pipOn; render(); toast(pipOn ? "PiP 字幕已开启（预览）" : "PiP 字幕已关闭"); break;
        case "attach":
          sheet("添加到当前对话",
            '<button class="sheet-choice" type="button" data-action="attach-session"><span><b>当前同传会话</b><small>' + recordTitle(selectedRecordId) + ' · ' + recordSubtitle(selectedRecordId).split("·").slice(-1)[0].trim() + '</small></span><span>＋</span></button>' +
            '<button class="sheet-choice" type="button" data-action="attach-file"><span><b>选择文本或文件</b><small>由你挑选，不自动读取其他内容</small></span><span>＋</span></button>',
            "附件范围在发送前可见，可随时移除。");
          break;
        case "attach-session":
          sessionAttached = true;
          document.getElementById("overlay").className = "hidden";
          render();
          toast("已附加：机场问路会话（预览）");
          break;
        case "remove-context":
          sessionAttached = false;
          render();
          toast("已从当前对话移除会话上下文。" );
          break;
        case "attach-file": document.getElementById("overlay").className = "hidden"; toast("文件选择器在 Android 框架阶段接入。"); break;
        case "voice": toast("语音输入：后续申请麦克风权限；当前不采集声音。"); break;
        case "send":
          const input = document.getElementById("chatInput");
          if (input && input.value.trim()) {
            const msg = document.createElement("article");
            msg.className = "message user";
            msg.innerHTML = '<div class="message-role">你</div><div class="message-body"></div>';
            msg.querySelector(".message-body").textContent = input.value.trim();
            document.querySelector(".chat-scroll").appendChild(msg);
            input.value = "";
            toast("消息留在预览里；Agent 模型调用尚未接入。");
          } else toast("先输入一条消息。");
          break;
        case "test-api": toast("预览不会联网，也不会保存输入的密钥。"); break;
        case "discover": toast("模型发现/手动填写流程会在设置页设计稿中继续细化。"); break;
        case "open-record": selectedRecordId = action.dataset.record || "airport"; showScreen("detail"); break;
        case "ask-latest":
          if (deletedRecords.airport) { toast("当前没有可附加的会话。" ); break; }
          selectedRecordId = "airport";
          sessionAttached = true;
          showScreen("chat");
          toast("已把机场问路会话附加到 Agent 对话。" );
          break;
        case "ask-agent":
          if (deletedRecords[selectedRecordId]) { toast("这条会话已删除，无法附加。" ); break; }
          sessionAttached = true;
          showScreen("chat");
          toast("已把机场问路会话附加到 Agent 对话。" );
          break;
        case "continue-session":
          if (selectedRecordId === "airport") {
            handsFree = false;
            continuousActive = false;
            showScreen("face");
          } else {
            mediaSource = selectedRecordId === "meeting" ? "mic" : "system";
            captureGranted = false;
            pipOn = false;
            showScreen("media");
          }
          break;
        case "save-phrase": toast("已收藏这句表达（预览状态）。" ); break;
        case "delete-session":
          sheet("删除这段会话？",
            '<p style="font-size:12px;line-height:1.7;color:var(--muted);margin:0">删除后会移除设备上的逐句原文、译文和收藏，无法恢复。</p><button class="sheet-choice" style="color:var(--red);font-weight:750" type="button" data-action="confirm-delete">删除' + recordTitle(selectedRecordId) + '</button>',
            '<button class="sheet-choice" style="justify-content:center" type="button" data-action="cancel-delete">保留会话</button>');
          break;
        case "cancel-delete": document.getElementById("overlay").className = "hidden"; break;
        case "confirm-delete":
          deletedRecords[selectedRecordId] = true;
          sessionAttached = false;
          const deletedTitle = recordTitle(selectedRecordId);
          showScreen("history");
          toast("预览：" + deletedTitle + "及其双语记录已删除。" );
          break;
        case "search":
          const searchInput = document.getElementById("historySearch");
          if (searchInput) searchInput.focus();
          break;
        case "privacy": toast("本地处理与远程 API 发送范围会逐次明确展示。"); break;
        case "more": toast("本轮对话设置会从此处打开。"); break;
      }
    });

    document.addEventListener("pointerdown", function (event) {
      const button = event.target.closest("[data-ptt]");
      if (!button) return;
      if (event.pointerType === "mouse" && event.button !== 0) return;
      startPtt(button, event);
    });
    document.addEventListener("pointerup", function () {
      finishPtt(false);
    });
    document.addEventListener("pointercancel", function () {
      finishPtt(true);
    });
    document.addEventListener("keydown", function (event) {
      const button = event.target.closest && event.target.closest("[data-ptt]");
      if (!button || (event.key !== " " && event.key !== "Enter") || event.repeat) return;
      event.preventDefault();
      startPtt(button, null);
    });
    document.addEventListener("keyup", function (event) {
      if ((event.key === " " || event.key === "Enter") && pressedPtt) {
        event.preventDefault();
        finishPtt(false);
      }
    });
    document.addEventListener("input", function (event) {
      if (event.target.id !== "historySearch") return;
      const query = event.target.value.trim().toLowerCase();
      document.querySelectorAll(".record-row").forEach(function (row) {
        row.classList.toggle("hidden", query.length > 0 && !row.textContent.toLowerCase().includes(query));
      });
    });

    document.getElementById("themeToggle").addEventListener("click", function () {
      document.documentElement.classList.toggle("dark-mode");
      this.textContent = document.documentElement.classList.contains("dark-mode") ? "切换浅色" : "切换深色";
    });
    document.getElementById("resetPreview").addEventListener("click", function () {
      captureGranted = false; pipOn = false; mediaSource = "system"; direction = "我说中文"; autoSpeak = true;
      handsFree = false; continuousActive = false; sessionAttached = false; selectedRecordId = "airport";
      Object.keys(deletedRecords).forEach(function (id) { delete deletedRecords[id]; });
      document.documentElement.classList.remove("dark-mode");
      document.getElementById("themeToggle").textContent = "切换深色";
      showScreen("home");
      toast("预览已回到初始状态。");
    });
    const requestedScreen = new URLSearchParams(window.location.search).get("screen");
    if (requestedScreen && screens[requestedScreen]) current = requestedScreen;
    render();
  </script>
</body>
</html>
