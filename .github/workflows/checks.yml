name: Source checks
on:
  push:
    branches: [main]
    paths: ['app/miyin/**', 'tool/release/**', '.github/workflows/**']
  pull_request:
    paths: ['app/miyin/**', 'tool/release/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app/miyin
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Dart tests (no native model inference)
        run: flutter test --no-pub --reporter expanded
      - name: Web logic tests
        run: |
          for file in test/web/*.cjs; do node "$file"; done
      - name: Install isolated browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/miyin-browser" playwright
          "$RUNNER_TEMP/miyin-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser interaction tests
        env:
          NODE_PATH: ${{ runner.temp }}/miyin-browser/node_modules
        run: node --test test/browser/*.cjs
      - name: English lexicon converter tests
        working-directory: .
        run: python3 tool/release/test_matcha_english_lexicon.py
