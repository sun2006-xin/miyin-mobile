name: Build Android preview
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-preview
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app/miyin
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Confirm actual model objects were downloaded
        run: git lfs fsck
      - run: flutter pub get
      - run: flutter build apk --release --target-platform android-arm64
      - name: Record APK checksum
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-release.apk > SHA256SUMS.txt
      - name: Save preview build (not a signed production release)
        uses: actions/upload-artifact@v4
        with:
          name: miyin-arm64-preview-${{ github.run_number }}
          path: |
            app/miyin/build/app/outputs/flutter-apk/app-release.apk
            app/miyin/build/app/outputs/flutter-apk/SHA256SUMS.txt
          retention-days: 7
          compression-level: 0
