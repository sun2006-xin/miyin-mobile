      - name: Sign, verify certificate and prepare download parts
        working-directory: .
        env:
          MIYIN_STORE_PASSWORD: ${{ secrets.MIYIN_STORE_PASSWORD }}
          MIYIN_KEYSTORE_PATH: ${{ runner.temp }}/miyin-signing/release.p12
          MIYIN_LEGACY_KEYSTORE_PATH: ${{ runner.temp }}/miyin-signing/legacy.keystore
        run: |
          manager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$manager"
          "$manager" 'build-tools;36.0.0'
          python3 tool/release/sign_and_package.py --apk app/miyin/build/app/outputs/flutter-apk/app-release.apk --output signed-release --apksigner-jar "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar"
      - name: Remove transient private keys
        if: always()
        working-directory: ${{ runner.temp }}
        run: rm -rf "$RUNNER_TEMP/miyin-signing"
      - name: Save verified release download files
        uses: actions/upload-artifact@v4
        with:
          name: miyin-arm64-signed-${{ github.run_number }}
          path: |
            signed-release/*.part*
            signed-release/*.json
            signed-release/*.txt
            signed-release/*.cmd
          retention-days: 7
          compression-level: 0
