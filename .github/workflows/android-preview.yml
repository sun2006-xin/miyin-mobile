name: Build signed Android release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-preview
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    environment: miyin-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app/miyin
    steps:
      - name: Free unused runner tools for bundled model build
        working-directory: ${{ runner.temp }}
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Confirm actual model objects were downloaded
        run: git lfs fsck
      - run: flutter pub get
      - name: Assemble unsigned official APK
        env:
          ORG_GRADLE_PROJECT_miyinProduction: 'true'
        run: flutter build apk --release --target-platform android-arm64
      - name: Restore protected signing material
        working-directory: .
        env:
          MIYIN_KEYSTORE_BASE64: ${{ secrets.MIYIN_KEYSTORE_BASE64 }}
          MIYIN_LEGACY_KEYSTORE_BASE64: ${{ secrets.MIYIN_LEGACY_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os,base64,pathlib
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'miyin-signing'
          target.mkdir(mode=0o700)
          for name,key in [('release.p12','MIYIN_KEYSTORE_BASE64'),('legacy.keystore','MIYIN_LEGACY_KEYSTORE_BASE64')]:
              raw=os.environ.get(key)
              if not raw: raise RuntimeError('Missing protected release secret: '+key)
              p=target/name;p.write_bytes(base64.b64decode(raw));p.chmod(0o600)
          PY
      - name: Sign, verify certificate and prepare download parts
        working-directory: .
        env:
          MIYIN_STORE_PASSWORD: ${{ secrets.MIYIN_STORE_PASSWORD }}
          MIYIN_KEYSTORE_PATH: ${{ runner.temp }}/miyin-signing/release.p12
          MIYIN_LEGACY_KEYSTORE_PATH: ${{ runner.temp }}/miyin-signing/legacy.keystore
        run: |
          sdkmanager 'build-tools;36.0.0'
          python3 tool/release/sign_and_package.py --apk app/miyin/build/app/outputs/flutter-apk/app-release.apk --output signed-release --apksigner-jar "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar"
      - name: Remove transient private keys
        if: always()
        working-directory: ${{ runner.temp }}
        run: rm -rf "$RUNNER_TEMP/miyin-signing"
      - name: Save verified release download files
        uses: actions/upload-artifact@v4
        with:
          name: miyin-arm64-signed-${{ github.run_number }}
          path: |
            signed-release/*.part*
            signed-release/*.json
            signed-release/*.txt
            signed-release/*.cmd
          retention-days: 7
          compression-level: 0
